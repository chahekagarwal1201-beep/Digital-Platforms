<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Guest Speaker Recap</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:ital,wght@0,500;0,700;0,800;1,700;1,800&family=Inter:wght@400;500;600;700&family=Caveat:wght@500;600&display=swap">
<style id="site-css">
*,*::before,*::after{box-sizing:border-box}
:root{
  --paper:#FAF7F2;
  --paper-hi:#FFFFFF;
  --paper-lo:#F0EAE2;
  --wine:#4A0D12;
  --wine-deep:#30070A;
  --wine-soft:#6E5557;
  --wine-line:rgba(74,13,18,.18);
  --ink:#141010;
  --pop:#B5707C;
  --pink:#EBC3CD;
  --display:"Inter Tight","Helvetica Neue",Helvetica,Arial,system-ui,sans-serif;
  --script:"Inter Tight","Helvetica Neue",Helvetica,Arial,sans-serif;
  --body:"Inter","Helvetica Neue",Helvetica,Arial,system-ui,sans-serif;
  --hand:"Caveat","Bradley Hand","Segoe Print",cursive;
  --navh:3.3rem;
  --r:6px;
}
html{background:var(--paper)}
body{background:var(--paper);color:var(--ink);font:400 1rem/1.55 var(--body);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:16;background:var(--wine)}
#app{overflow-x:clip}
button,input,textarea,select{font:inherit;color:inherit}
h1,h2,h3,h4{text-wrap:balance}
h1,h2,h3,h4,legend{font-synthesis:none}
p{margin:0}
:focus-visible{outline:3px solid var(--wine-deep);outline-offset:2px}
.ph{color:var(--wine-soft);font-style:italic;font-weight:400}
.hint{font-size:.88rem;color:var(--wine-soft)}

/* bands */
.band{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.inner{max-width:1200px;margin-inline:auto}
.rail-band{padding-block:2.25rem 1.75rem}
.detail-band{padding-block:2.25rem 3rem;border-top:1.5px solid var(--wine-line)}
body.is-editing .detail-band{padding-bottom:9rem}

.eyebrow{font:600 .74rem/1.35 var(--body);letter-spacing:.18em;text-transform:uppercase;margin:0 0 .6rem}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;font:600 .82rem/1 var(--body);letter-spacing:.1em;text-transform:uppercase;padding:.85rem 1.2rem;border-radius:var(--r);border:1.5px solid var(--wine);background:var(--wine);color:var(--paper);cursor:pointer;transition:background .15s}
.btn:hover{background:var(--wine-deep);border-color:var(--wine-deep)}
.btn-ghost{background:transparent;color:var(--wine)}
.btn-ghost:hover{background:var(--paper-hi);border-color:var(--wine)}
.btn-sm{padding:.6rem .9rem;font-size:.74rem}
.btn:disabled{opacity:.55;cursor:default}
.link-btn{background:none;border:0;padding:.25rem;color:var(--wine);font:500 .85rem var(--body);text-decoration:underline;text-underline-offset:3px;cursor:pointer}

/* sessions: contents list, then a wrapping grid of boxes */
.rail-head{text-align:center}
.sessions-body{margin-top:1.75rem}
.rail-title{font:800 clamp(2.4rem,6vw,4rem)/1 var(--display);letter-spacing:-.045em;text-transform:lowercase;margin:0;color:var(--ink)}
.toc-wrap{max-width:40rem;margin:0 auto 2.75rem}
.toc-toggle{display:flex;align-items:center;gap:.6rem;margin:0 auto;padding:.6rem 1.1rem;border:1.5px solid var(--wine);border-radius:999px;background:transparent;color:var(--wine);font:500 .74rem/1.2 var(--body);letter-spacing:.18em;text-transform:uppercase;cursor:pointer;transition:background .15s,color .15s}
.toc-toggle:hover{background:var(--paper-hi)}
.toc-toggle[aria-expanded="true"]{background:var(--wine);color:var(--paper)}
.toc-caret{font-size:1rem;line-height:1;letter-spacing:0}
.toc-empty{text-align:center;margin-top:1rem}
.toc{list-style:none;margin:1rem 0 0;padding:0;border-top:1px solid var(--wine-line)}
.toc li{border-bottom:1px solid var(--wine-line)}
.toc-link{display:flex;align-items:baseline;gap:.75rem;width:100%;padding:.75rem .5rem;background:none;border:0;color:var(--wine);text-align:left;cursor:pointer;transition:background .15s}
.toc-link:hover,.toc-link[aria-current="true"]{background:var(--paper-hi)}
.toc-num{flex:0 0 1.4rem;font-weight:500;font-variant-numeric:tabular-nums}
.toc-name{font-weight:600;min-width:0;overflow-wrap:anywhere}
.toc-lead{flex:1 1 1.5rem;min-width:1.5rem;border-bottom:1.5px dotted var(--wine-line);transform:translateY(-.3em)}
.toc-co{font-family:var(--script);font-style:italic;font-size:1.05rem;text-align:right;min-width:0;overflow-wrap:anywhere}
.track{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1.5rem 1rem}
@media (min-width:700px){.track{grid-template-columns:repeat(3,minmax(0,1fr));gap:1.75rem 1.25rem}}
@media (min-width:1000px){.track{grid-template-columns:repeat(4,minmax(0,1fr))}}
.sess-item{position:relative;min-width:0;display:flex;flex-direction:column;gap:.7rem}
.sess-card{flex:1 1 auto;display:grid;gap:.85rem;align-content:start;width:100%;padding:0;border:0;background:none;color:var(--wine);text-align:left;cursor:pointer;border-radius:clamp(1.25rem,3vw,2rem)}
.sess-panel{container-type:inline-size;position:relative;display:grid;place-items:center;aspect-ratio:4/5;padding:2.75rem .9rem 3.75rem;border-radius:clamp(1.25rem,3vw,2rem);background:var(--card,var(--paper-hi));color:var(--card-ink,var(--wine));border:1.5px solid var(--card-line,var(--wine-line));transition:transform .2s ease,box-shadow .2s}
.sess-card:hover .sess-panel{transform:translateY(-4px)}
.sess-panel .ph{color:inherit;opacity:.7}
.sess-badge{position:absolute;top:.85rem;left:.85rem;padding:.3rem .65rem;border-radius:999px;background:var(--card-ink,var(--wine));color:var(--card,var(--paper-hi));font:500 .74rem/1.2 var(--body);letter-spacing:.14em;text-transform:uppercase}
.sess-brand{font-family:var(--display);font-weight:800;font-size:clamp(1.5rem,3vw,2.6rem);font-size:clamp(1.1rem,13cqi,2.6rem);line-height:1.05;text-transform:uppercase;letter-spacing:-.02em;text-align:center;overflow-wrap:anywhere;text-wrap:balance}
.sess-mid{display:grid;justify-items:center;gap:.85rem;width:100%}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.sess-logo{display:block;width:86%;height:clamp(3rem,7vw,5.25rem);background:currentColor;-webkit-mask:var(--logo) center/contain no-repeat;mask:var(--logo) center/contain no-repeat}
.logo-row{position:relative;display:flex;flex-wrap:wrap;align-items:center;gap:.75rem}
.logo-prev{display:grid;place-items:center;width:9rem;height:4.5rem;padding:.6rem;border-radius:.9rem;background:var(--card,var(--paper-hi));color:var(--card-ink,var(--wine));border:1.5px solid var(--card-line,var(--wine-line))}
.logo-prev .sess-logo{width:100%;height:100%}
.sr-file{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none}
.sr-file:focus-visible+label{outline:3px solid var(--wine-deep);outline-offset:2px}
.sess-pill{position:absolute;left:50%;bottom:.95rem;transform:translateX(-50%);padding:.6rem 1.05rem;border-radius:999px;border:1.5px solid var(--card-ink,var(--wine));background:var(--card-ink,var(--wine));color:var(--card,var(--paper-hi));font:600 .74rem/1 var(--body);letter-spacing:.1em;text-transform:uppercase;white-space:nowrap;transition:background .15s,color .15s}
.sess-card:hover .sess-pill{background:transparent;color:var(--card-ink,var(--wine))}
.is-open .sess-panel{box-shadow:0 0 0 3px var(--paper),0 0 0 5.5px var(--pop)}
.sess-meta{display:grid;gap:.15rem;padding-inline:.35rem}
.sess-name{font-family:var(--display);font-weight:700;font-size:1.2rem;line-height:1.25;letter-spacing:-.01em;color:var(--ink)}
.sess-role{font-size:.95rem;line-height:1.4;color:var(--wine-soft);overflow-wrap:anywhere}
.sess-add .sess-panel{--card:transparent;--card-ink:var(--wine);--card-line:var(--wine);border-style:dashed;gap:.4rem;align-content:center}
.sess-add-plus{font:300 3rem/1 var(--body)}
.sess-add-lbl{font:600 .74rem/1 var(--body);letter-spacing:.14em;text-transform:uppercase}
.color-row{display:flex;align-items:center;gap:.75rem;flex-wrap:wrap}
.color-inp{width:3.25rem;height:2.6rem;padding:.15rem;border:1.5px solid var(--wine-line);border-radius:var(--r);background:var(--paper);cursor:pointer}
.link-btn:disabled{opacity:.45;cursor:default;text-decoration:none}

/* edit tools under each box */
.sess-tools{display:flex;justify-content:center;gap:.35rem}
.tool{display:grid;place-items:center;min-width:2.2rem;height:2.2rem;padding:0 .5rem;border:1.5px solid var(--wine);border-radius:var(--r);background:transparent;color:var(--wine);cursor:pointer;font-size:.95rem;line-height:1}
.tool:hover:not(:disabled){background:var(--paper-lo)}
.tool:disabled{opacity:.3;cursor:default}
.tool.is-armed{background:var(--wine-deep);color:var(--paper);font-size:.68rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase}
.tool-grip{cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;color:var(--wine-soft)}
.tool-grip::before{content:"";width:14px;height:8px;background-image:radial-gradient(circle,currentColor 1.2px,transparent 1.4px);background-size:4.67px 4px}
.sess-item.is-dragging{opacity:.45}
.sess-item.drop-before::before,.sess-item.drop-after::after{content:"";position:absolute;top:0;bottom:0;width:3px;border-radius:2px;background:var(--wine);left:-.7rem}
.sess-item.drop-after::after{left:auto;right:-.7rem}

/* open session */
.detail-empty{text-align:center;color:var(--wine-soft);padding-block:1rem}
.detail-head{display:flex;justify-content:flex-end;margin-bottom:.5rem;max-width:62rem}
.plate{display:flex;gap:1.1rem;align-items:stretch;margin-bottom:2.25rem;max-width:62rem}
.plate-num{display:flex;align-items:center;padding-right:1.1rem;border-right:1.5px solid var(--wine-line);font-family:var(--body);font-weight:400;font-size:clamp(2rem,5vw,2.75rem);line-height:1;font-variant-numeric:tabular-nums}
.plate-text{min-width:0;flex:1 1 auto}
.plate-name{font-family:var(--display);font-weight:800;font-size:clamp(2.4rem,6vw,4rem);line-height:.95;letter-spacing:-.045em;margin:0;color:var(--ink)}
.plate-role{margin-top:.55rem;font-size:1.08rem}
.sep{margin-inline:.45rem;opacity:.6}
.plate-links{margin-top:.9rem;display:flex;flex-wrap:wrap;gap:.5rem;align-items:center}
.li-label{font-size:.74rem;font-weight:500;letter-spacing:.14em;text-transform:uppercase;margin-right:.25rem}
.li-link{display:inline-flex;align-items:center;gap:.35rem;padding:.4rem .8rem;border:1.5px solid var(--wine);border-radius:999px;color:var(--wine);text-decoration:none;font-size:.8rem;font-weight:500;letter-spacing:.08em;text-transform:uppercase;transition:background .15s}
.li-link:hover{background:var(--wine);color:var(--paper)}
.notes{border-top:1.5px solid var(--wine);padding-top:1.1rem;max-width:46rem}
.notes-title{font-family:var(--display);font-weight:800;font-size:2rem;letter-spacing:-.04em;text-transform:lowercase;margin:0 0 1rem;color:var(--ink)}
.notes-list{margin:0;padding-left:1.2rem;display:grid;gap:.85rem;font-size:1.08rem}
.notes-list li{white-space:pre-line;overflow-wrap:anywhere;padding-left:.2rem}
.notes-list li::marker{content:"\25C6\00a0\00a0";font-size:.7em}
.empty{border:1.5px dashed var(--wine-line);border-radius:var(--r);padding:1.25rem;display:grid;gap:.75rem;justify-items:start;color:var(--wine-soft)}
.notice{display:flex;flex-wrap:wrap;gap:.75rem 1rem;align-items:center;justify-content:space-between;border:1.5px dashed var(--wine);border-radius:var(--r);padding:.8rem 1rem;margin-bottom:1.5rem;background:var(--paper-hi)}
.notice p{flex:1 1 18rem;min-width:0}
.notice-btns{display:flex;flex-wrap:wrap;gap:.5rem}

/* editor */
.ed{display:grid;gap:1.25rem;max-width:54rem}
.ed-title{font-family:var(--display);font-weight:800;letter-spacing:-.04em;font-size:clamp(2rem,5vw,3rem);line-height:1;margin:0}
.ed-card{border:1.5px solid var(--wine);border-radius:var(--r);padding:1rem 1.25rem 1.25rem;margin:0;background:var(--paper-hi);min-width:0;display:grid;gap:.9rem}
.ed-card legend{font-family:var(--display);font-weight:800;font-size:1.35rem;letter-spacing:-.03em;text-transform:lowercase;padding:0 .4rem}
.fld{display:grid;gap:.3rem;min-width:0;align-content:start}
.fld>label{font-size:.74rem;letter-spacing:.12em;text-transform:uppercase;font-weight:500}
.inp{width:100%;background:var(--paper);color:var(--wine);border:1.5px solid var(--wine-line);border-radius:var(--r);padding:.6rem .75rem;line-height:1.4}
.inp:focus{border-color:var(--wine)}
.inp::placeholder{color:var(--wine-soft);opacity:.75}
textarea.inp{resize:vertical}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.9rem}
@media (max-width:620px){.grid2{grid-template-columns:minmax(0,1fr)}}
.ed-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:.5rem;align-items:end}
.ed-add{justify-self:start}
.ed-del{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center;padding-top:1rem;border-top:1px solid var(--wine-line)}
.ed-del p{flex:1 1 100%}
.gq{display:grid;gap:.65rem;padding:.9rem 1rem 1rem;border:1.5px dashed var(--wine-line);border-radius:var(--r);background:var(--paper)}
.gq-head{display:flex;justify-content:space-between;align-items:center;gap:.5rem}
.gq-num{font-size:.74rem;letter-spacing:.12em;text-transform:uppercase;font-weight:600}
.gq-opts{border:0;margin:0;padding:0;display:grid;gap:.45rem;min-width:0}
.gq-opts legend{font-size:.74rem;letter-spacing:.12em;text-transform:uppercase;font-weight:500;padding:0;margin-bottom:.35rem}
.gq-opt{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:.55rem;align-items:center}
.gq-opt input[type=radio]{width:1.2rem;height:1.2rem;margin:0;accent-color:var(--wine);cursor:pointer}
.gq-add-opt{justify-self:start}
.about-ed{max-width:54rem;margin-inline:auto;text-align:left}

.quiz-band{padding-block:2.25rem 3.5rem;border-top:1.5px solid var(--wine-line)}
.quiz{max-width:46rem;text-align:center}
.quiz .rail-title{margin:0}
.quiz-body{margin-top:1.25rem}
.quiz-intro{color:var(--wine-soft)}
.quiz-tabs{margin-top:1.1rem}
.quiz-kick{display:block;font:600 .64rem/1.2 var(--body);letter-spacing:.18em;text-transform:uppercase;opacity:.8;margin-bottom:.4rem}
.quiz-panel{grid-column:1/-1;text-align:left}
.quiz .game-sub{margin:0 0 .8rem}
.quiz-missing{margin-top:1rem}
.quiz-tabs{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,14rem),1fr));gap:1rem;margin-top:1.2rem}
.about-tab.quiz-tab{display:flex;justify-content:space-between;align-items:center;width:100%;padding:1.2rem 1.1rem 1.2rem 1.35rem;border:0;border-radius:12px;background:var(--wine);color:#fff;font:800 1.3rem/1.1 var(--display);letter-spacing:-.02em;text-transform:none;box-shadow:0 26px 40px -24px rgba(74,13,18,.7)}
.about-tab.quiz-tab:hover{background:var(--wine-deep)}
.about-tab.quiz-tab[aria-expanded="true"]{background:#fff;color:var(--wine);box-shadow:inset 0 0 0 1.5px var(--wine)}
.quiz-tab .about-caret{width:1.9rem;height:1.9rem;font-size:1.1rem}
@media (max-width:620px){.quiz-tab{order:var(--o)}.quiz-panel{order:var(--po)}}

/* top bar */
.topnav{position:sticky;top:0;z-index:15;background:var(--wine);color:#fff;padding-top:env(safe-area-inset-top,0px);box-shadow:0 1px 0 rgba(255,255,255,.06)}
.topnav-in{max-width:1200px;margin-inline:auto;display:flex;justify-content:space-around;align-items:center;gap:.25rem;min-height:var(--navh);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
.nav-link{display:inline-flex;align-items:center;gap:.5rem;padding:.95rem .7rem;background:none;border:0;color:#fff;font:600 .72rem/1 var(--body);letter-spacing:.24em;text-transform:uppercase;white-space:nowrap;cursor:pointer;text-underline-offset:7px;text-decoration-thickness:1.5px}
.nav-link:hover,.nav-link[aria-current="true"]{text-decoration:underline}
.rail-title[tabindex]:focus{outline:none}
.topnav :focus-visible{outline-color:#fff;outline-offset:-3px}
@media (max-width:560px){.nav-link{letter-spacing:.1em;font-size:.64rem;padding:.95rem .35rem;gap:.3rem}}

/* opening page */
.hero{position:relative;display:grid;place-items:center;min-height:calc(100vh - var(--navh));min-height:calc(100svh - var(--navh));padding:4.5rem max(16px,env(safe-area-inset-left,0px)) 4rem;background-color:#2b1d1a;background-image:linear-gradient(180deg,rgba(18,8,6,.30) 0%,rgba(18,8,6,.40) 50%,rgba(18,8,6,.66) 100%),var(--hero-img,none);background-size:cover;background-position:center 42%;color:#fff;text-align:center}
.hero-in{max-width:56rem;display:grid;justify-items:center;gap:1.15rem}
.hero-eyebrow{font:600 .74rem/1.3 var(--body);letter-spacing:.24em;text-transform:uppercase;opacity:.92}
.hero-title{margin:0;max-width:11ch;font:800 clamp(3.2rem,10.5vw,8.25rem)/.9 var(--display);letter-spacing:-.05em;text-wrap:balance;text-shadow:0 4px 40px rgba(0,0,0,.28);color:#fff}
.hero-title em{font-style:italic;font-weight:800}
.hero-tag{max-width:30rem;font-size:1rem;line-height:1.55;opacity:.95;text-wrap:balance}
.hero-pills{list-style:none;margin:.35rem 0 0;padding:0;display:flex;flex-wrap:wrap;justify-content:center;gap:.6rem}
.hero-pills li{padding:.6rem 1.15rem;border-radius:999px;background:#fff;color:var(--ink);font:700 .66rem/1 var(--body);letter-spacing:.14em;text-transform:uppercase;box-shadow:0 8px 20px -10px rgba(0,0,0,.45)}
.icon-row{display:flex;justify-content:center;margin-top:.4rem}
.icon-btn{display:inline-grid;place-items:center;width:2.15rem;height:2.15rem;border-radius:50%;border:1.5px solid currentColor;color:inherit;font:700 .82rem/1 var(--body);letter-spacing:-.02em;text-decoration:none;transition:background .15s,color .15s}
.hero .icon-btn:hover{background:#fff;color:var(--ink);border-color:#fff}
.hero-tools{display:flex;flex-wrap:wrap;justify-content:center;gap:.5rem;margin-top:1.25rem}
.hero-tools .btn{background:rgba(255,255,255,.94);border-color:transparent;color:var(--ink);border-radius:999px}
.hero-tools .btn:hover{background:#fff;border-color:#fff}
.mast-note{flex:1 1 100%;margin:0;font-size:.88rem;color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.6)}
.mast-note:empty{display:none}
.hero :focus-visible{outline-color:#fff}
.about-band,.rail-band,.detail-band,.quiz-band{scroll-margin-top:var(--navh)}

/* about me: planner + copy */
.about-band{padding-block:3rem;border-bottom:1.5px solid var(--wine-line)}
.about{max-width:1120px}
.about-closed{text-align:center}
.about .rail-title{margin:0}
.about-toggle{display:inline-flex;align-items:center;gap:.8rem;padding:0;border:0;background:none;color:inherit;font:inherit;letter-spacing:inherit;text-transform:inherit;cursor:pointer;text-align:left}
.about-toggle .about-caret{width:2.2rem;height:2.2rem;font-size:1.3rem;transition:background .15s,color .15s}
.about-toggle:hover .about-caret,.about-toggle[aria-expanded="true"] .about-caret{background:var(--wine);color:#fff;border-color:var(--wine)}
.about-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:clamp(2rem,5vw,4.5rem);align-items:start;padding:clamp(1.5rem,4vw,3.25rem);background:#FDFBF7;border-radius:6px;box-shadow:0 40px 70px -48px rgba(50,12,12,.45)}
@media (min-width:821px){.about-grid .planner{position:sticky;top:calc(var(--navh) + 2rem)}}
@media (max-width:820px){.about-grid{grid-template-columns:minmax(0,1fr)}}
.about-copy{min-width:0}
.about-text{margin-top:1.1rem;font-size:.98rem;line-height:1.8;white-space:pre-line;text-wrap:pretty;color:var(--ink)}
.about-pills{display:flex;flex-wrap:wrap;gap:.55rem;margin-top:1.5rem}

/* the planner (drawn with CSS) */
.planner{position:relative;width:min(100%,27rem);aspect-ratio:1.08/1;margin:0 auto;border-radius:16px 22px 22px 16px}

/* search */
body.no-scroll{overflow:hidden}

/* recall game */
.game-sec{margin-top:2.75rem;max-width:46rem;border-top:1.5px solid var(--wine);padding-top:1.1rem}
.game-sub{margin:-.4rem 0 1rem;color:var(--wine-soft)}

.game-ask.is-in{transform:translate(-50%,-50%) scale(1);opacity:1}
.game-ask.is-docked{top:.7rem;transform:translate(-50%,0) scale(1);width:calc(100% - 1.4rem);font-size:.98rem;padding:.6rem .9rem;box-shadow:0 4px 0 var(--wine-deep)}
.game-ask-kick{display:block;font:500 .7rem/1.2 var(--body);letter-spacing:.18em;text-transform:uppercase;color:var(--pink);margin-bottom:.45rem}

.game-tile{position:absolute;left:0;top:0;z-index:2;display:grid;place-items:center;min-height:3.1rem;padding:.55rem .7rem;border-radius:.9rem;background:var(--tile,var(--pink));color:var(--tile-ink,var(--wine));border:1.5px solid var(--wine);box-shadow:0 4px 0 var(--wine);font-weight:600;font-size:.92rem;line-height:1.25;text-align:center;overflow-wrap:anywhere;will-change:transform;transition:opacity .3s}
.game-tile.is-wrong{opacity:.4;text-decoration:line-through;animation:gshake .35s}
.game-tile.is-right{background:var(--paper);color:var(--wine);box-shadow:0 0 0 4px var(--pop),0 4px 0 var(--wine)}
.game-tile.is-fade{opacity:0}
@keyframes gshake{25%{translate:-6px 0}75%{translate:6px 0}}
.game-catcher{position:absolute;left:0;bottom:16px;z-index:2;height:26px;border-radius:6px 6px 14px 14px;background:var(--wine);box-shadow:0 4px 0 var(--wine-deep);display:grid;place-items:center;color:var(--pink);font:600 .62rem/1 var(--body);letter-spacing:.24em;text-transform:uppercase;will-change:transform}
.game-stage:not(.is-playing) .game-catcher{visibility:hidden}

.game-flash{position:absolute;left:50%;bottom:4.4rem;z-index:4;max-width:88%;transform:translateX(-50%);padding:.45rem .9rem;border-radius:999px;background:var(--paper);border:1.5px solid var(--wine);font-weight:600;font-size:.88rem;text-align:center;opacity:0;transition:opacity .2s;pointer-events:none}

.game-over{position:absolute;inset:0;z-index:5;display:flex;overflow:auto;padding:1.25rem;background:var(--paper);background:color-mix(in srgb,var(--paper) 97%,transparent);text-align:center}
.game-card{margin:auto;max-width:28rem;display:grid;gap:.8rem;justify-items:center}
.game-card .eyebrow{margin:0}
.game-title{font-family:var(--display);font-weight:800;font-size:clamp(1.9rem,5vw,2.6rem);line-height:1;letter-spacing:-.04em;text-transform:lowercase;margin:0}

.game-review li{display:grid;grid-template-columns:1.4rem minmax(0,1fr);gap:.35rem;padding-bottom:.5rem;border-bottom:1px solid var(--wine-line)}

      "notes": [
        "Yibo, Nirvan and Rishabh from LaunchLab showed us that you no longer need to be a developer to build something real. Their workflow had three steps: design the look of the site in Claude Design, hand it off to Claude Code to turn it into working files, then put it online. What struck me was that the hard part has moved from writing code to explaining clearly what you want. A vague prompt like “make a website for my course” gives you something generic, while a prompt that sets out the role, goal, audience, pages and design style gives you something you can actually use. It is really the same skill as writing a good marketing brief.",
        "The second half took the mystery out of tools developers take for granted. GitHub is where code lives along with its full history: you commit to save a snapshot, push to send it online, and open a pull request when someone should review your changes before they are merged. Vercel then turns that code into a live website that updates itself every time you push. I found it helpful to think of a site as three files with three jobs: index.html holds the words, styles.css controls the look, and script.js decides what happens when someone clicks.",
        "The idea that stayed with me most was what a website still cannot do on its own. It forgets every visitor the moment the tab closes, and it only knows what is written in its own files. Logins, saved progress and live information all need a back end such as Supabase, and even logging in is just the site asking another computer for a temporary token. It made me realise that a working prototype can now be built in an afternoon, so the real value lies in understanding the customer well enough to know what is worth building. This recap site was the task they set us, and making it showed me how quickly an idea can become something people can click on."

function processLogo(file) {
  return new Promise((resolve, reject) => {
    if (!file || !/^image\//.test(file.type)) { reject(new Error('type')); return; }
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      try {
        const W = img.naturalWidth, H = img.naturalHeight;
        const c = document.createElement('canvas'); c.width = W; c.height = H;
        const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, W, H); x.drawImage(img, 0, 0);
        const d = x.getImageData(0, 0, W, H); const px = d.data;
        let minX = W, minY = H, maxX = -1, maxY = -1;
        for (let i = 0, j = 0; i < px.length; i += 4, j++) {
          const a = 255 - Math.min(px[i], px[i + 1], px[i + 2]); const v = a < 14 ? 0 : a;
          px[i] = px[i + 1] = px[i + 2] = 0; px[i + 3] = v;
          if (v) { const cx = j % W, cy = (j / W) | 0; if (cx < minX) minX = cx; if (cx > maxX) maxX = cx; if (cy < minY) minY = cy; if (cy > maxY) maxY = cy; }
        }
        if (maxX < 0) { reject(new Error('empty')); return; }
        x.putImageData(d, 0, 0);
        const cw = maxX - minX + 1, ch = maxY - minY + 1; const k = Math.min(1, 520 / cw, 260 / ch);
        const o = document.createElement('canvas'); o.width = Math.max(1, Math.round(cw * k)); o.height = Math.max(1, Math.round(ch * k));
        const ox = o.getContext('2d'); ox.imageSmoothingQuality = 'high'; ox.drawImage(c, minX, minY, cw, ch, 0, 0, o.width, o.height);
        resolve(o.toDataURL('image/png'));
      } catch (e) { reject(e); } finally { URL.revokeObjectURL(url); }
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('load')); };
    img.src = url;
  });
}

async function save(retried) {
  if (!ui.editing || (ui.saving && !retried)) return;
  if (!ui.artifact) { setStatus('Saving isn\'t available in this view. Open the page on claude.ai while signed in, or copy your content and send it to Claude.', 'err', true); return; }
  const state = normState(ui.draft);
  let html;
  try { html = buildDocument(state); } catch (e) { setStatus('The page couldn\'t be prepared for saving. Copy your content and send it to Claude.', 'err', true); return; }
  ui.saving = true; ui.confirm = null; setStatus('Saving…');
  sess.set('gsr:tab', ui.tab);
  writeDraft(true);
  try {
    await ui.artifact.publish(html);
    store.del(DRAFT_KEY);
    ui.saving = false;
    setStatus('Saved. Loading the new version…');
  } catch (err) {
    const code = err && err.code;
    ui.saving = false;
    if (code === 'conflict') { writeDraft(true, 'stale'); setStatus('A newer version was saved somewhere else, so the page is reloading to it. Your edits are kept in this browser and you can resume them.', 'err'); return; }
    if (['not_writer', 'not_granted', 'consent_required', 'capability_disabled', 'capability_removed', 'not_declared'].includes(code)) { ui.readOnly = true; setStatus('This view is read-only, so changes can\'t be saved here. Only the page owner can save, from claude.ai.', 'err', true); return; }
    if (code === 'too_large') { setStatus('The page is too large to save. Shorten some notes and try again.', 'err'); return; }
    if (code === 'rate_limited') { setStatus('Saved too often in a short time. Wait a minute, then press Save again.', 'err'); return; }
    if (code === 'invalid_content' || code === 'transform_error') { setStatus('The content was rejected when saving. Copy your content and send it to Claude.', 'err', true); return; }
    if (!retried) { ui.saving = true; renderEditBar(); setTimeout(() => save(true), 1200 + Math.random() * 800); return; }
    setStatus('Saving failed because of a service problem. Try again in a moment.', 'err', true);
  }
}
function copyContent() {

  if (G !== g || g.phase !== 'ask') return;

  const q = g.qs[g.idx];
  const lanes = shuffle(q.options.map((o, j) => j));
  const top = g.ask.offsetTop + g.ask.offsetHeight;
  const secs = Math.max(3.4, 5.4 - g.idx * 0.3) * (reduced() ? 1.4 : 1);
  const base = (g.H - top) / secs;
  g.tiles = q.options.map((text, j) => {
    const el = document.createElement('div');
    el.className = 'game-tile'; el.textContent = text; el.setAttribute('aria-hidden', 'true');
    g.stage.insertBefore(el, g.catcher);
    return { el, text, right: j === q.answer, lane: lanes[j], n: q.options.length, x: 0, y: -400, w: 0, h: 0, v: base * (0.85 + Math.random() * 0.3), state: 'fall' };
  });
  layoutTiles(g);
  g.tiles.forEach((t, j) => { t.y = top - t.h - 6 - (j * 0.22 + Math.random() * 0.35) * t.v; });
  layoutTiles(g);
  g.phase = 'fall';
  ensureLoop(g);
}
function ensureLoop(g) { if (!g.raf) { g.last = 0; g.raf = requestAnimationFrame(tick); } }
function tick(now) {
  const g = G;
  if (!g) return;
  g.raf = 0;
  const dt = g.last ? Math.min(0.05, (now - g.last) / 1000) : 0;
  g.last = now;
  if (!g.root.isConnected) return;
  if (g.dir && g.phase !== 'intro' && g.phase !== 'done') { g.cx = clamp01(g.cx + g.dir * dt * 1.15); placeCatcher(g); }
  if (g.phase === 'fall') stepTiles(g, dt);
  if (g.phase !== 'intro' && g.phase !== 'done') g.raf = requestAnimationFrame(tick);
}
function stepTiles(g, dt) {
  const c = catcherBox(g);
  for (const t of g.tiles) {
    if (t.state !== 'fall') continue;
    const prevBottom = t.y + t.h;
    t.y += t.v * dt;
    const bottom = t.y + t.h;
    if (prevBottom <= c.top + 8 && bottom >= c.top) {
      const overlap = Math.min(t.x + t.w, c.x + c.w) - Math.max(t.x, c.x);
      if (overlap > Math.min(t.w, c.w) * 0.4) {
        t.y = c.top - t.h + 6;
        t.el.style.transform = 'translate3d(' + t.x + 'px,' + t.y + 'px,0)';
        caught(g, t);
        if (g.phase !== 'fall') return;
        continue;
      }
    }
    t.el.style.transform = 'translate3d(' + t.x + 'px,' + t.y + 'px,0)';
    if (t.y > g.H + 4) {
      t.state = 'gone'; t.el.remove();
      if (t.right) { missed(g, t); return; }
    }
  }
}
function fadeOthers(g, keep) {
  g.tiles.forEach(t => { if (t !== keep && t.state === 'fall') { t.state = 'gone'; t.el.classList.add('is-fade'); } });
}
function caught(g, t) {
  const q = g.qs[g.idx];
  if (t.right) {
    t.state = 'caught'; t.el.classList.add('is-right');
    g.score += PTS; setScore(g, true);
    g.results.push({ ok: true });
    flash(g, '+' + PTS + ' · Correct!');
    say(g, 'Correct! Plus ' + PTS + ' points. Score ' + g.score + '.');
    g.phase = 'won'; fadeOthers(g, t);
    g.timer = setTimeout(() => nextQ(g), 1150);
  } else {
    t.state = 'wrong'; t.el.classList.add('is-wrong'); g.tries++;
    flash(g, 'Not that one. Keep going!');
    say(g, 'Not that one.');
    setTimeout(() => t.el.classList.add('is-fade'), 450);
  }
}
function missed(g, t) {
  g.results.push({ ok: false });
  g.phase = 'missed'; fadeOthers(g, null);
  flash(g, 'Missed it! The answer was: ' + t.text);
  say(g, 'Missed. The answer was ' + t.text + '.');
  g.timer = setTimeout(() => nextQ(g), 2100);
}
function finish(g) {
  g.phase = 'done'; clearTiles(g);
  g.ask.className = 'game-ask'; g.ask.innerHTML = '';
  g.stage.classList.remove('is-playing');
  g.dir = 0;
  const max = g.qs.length * PTS;
  const best = readBest(g.sid);
  if (best == null || g.score > best) store.set(bestKey(g.sid), String(g.score));
  const pct = max ? g.score / max : 0;
  const msg = pct === 1 ? 'Perfect recall!' : pct >= 0.7 ? 'Great memory.' : pct >= 0.4 ? 'Not bad. One more round?' : 'Have another read of the notes, then try again.';
  g.over.innerHTML = '<div class="game-card"><p class="eyebrow">Final score</p><p class="game-big">' + g.score + ' <small>/ ' + max + '</small></p><p>' + msg +
    (best != null && g.score > best ? ' New best!' : '') + '</p>' +
    '<button class="btn" data-g="again">Play again</button>' +
    '<p class="eyebrow">The answers</p><ol class="game-review">' + g.qs.map((q, i) => { const ok = g.results[i] && g.results[i].ok; return '<li><span class="mk" aria-label="' + (ok ? 'Caught' : 'Missed') + '">' + (ok ? '✓' : '✗') + '</span><span>' + esc(q.q) + '<span class="ans">' + esc(q.options[q.answer]) + '</span></span></li>'; }).join('') + '</ol></div>';
  g.over.hidden = false;
  say(g, 'Game over. You scored ' + g.score + ' out of ' + max + '.');
  const b = g.over.querySelector('[data-g]'); if (b) b.focus({ preventScroll: true });
}

/* ---------- capabilities ---------- */
async function initCaps() {
  const c = window.claude;
  if (!c || typeof c.use !== 'function') return;
  let art = null, usr = null;
  try { art = await c.use('artifact'); } catch (e) { art = null; }
  if (!art || typeof art.publish !== 'function') return;
  try { usr = await c.use('user'); } catch (e) { usr = null; }
  let can = false;
  if (usr) {
    try {
      const w = typeof usr.can === 'function' ? await usr.can('files.write') : null;
      can = w === null ? await usr.canEdit() : !!w;
    } catch (e) { can = false; }
  }
  let dl = null;
  if (can) { try { dl = await c.use('downloads'); } catch (e) { dl = null; } }
  ui.artifact = art; ui.canEdit = !!can; ui.downloads = dl && typeof dl.save === 'function' ? dl : null;
  if (ui.canEdit) render();
}

/* ---------- boot ---------- */
function start(prev) {
  prev = prev || {};
  if (!els) buildShell();
  wire();
  const ids = ['home'].concat(data.speakers.map(s => s.id));
  let fromHash = '';
  try { fromHash = decodeURIComponent((location.hash || '').slice(1)); } catch (e) {}
  const fromSess = sess.get('gsr:tab'); sess.del('gsr:tab');
  ui.tab = [fromHash, prev.tab, fromSess].find(t => t && ids.includes(t)) || 'home';
  if (ui.tab !== 'home') { ui.section = 'sessions'; ui.sessionsShow = true; }
  readDraft();
  render();
  initCaps();
}

const hot = window.claude && window.claude.hot;
try { if (hot && typeof hot.snapshot === 'function') hot.snapshot(() => ({ tab: ui.tab })); } catch (e) {}
if (hot && typeof hot.ready === 'function') hot.ready(start); else start((hot && hot.data) || {});
})();
</script>
