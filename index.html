<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Guest Speaker Recap</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:ital,wght@0,400;0,500;0,600;1,400&family=Lilita+One&family=Playfair+Display:ital,wght@1,400;1,500&display=swap">
<style id="site-css">
*,*::before,*::after{box-sizing:border-box}
:root{
  /* Layout: header band, then a horizontal rail of session boxes (scrolls sideways, arrows at the edges), then the open session's notes below. */
  --paper:#F7EEE9;
  --paper-hi:#FCF7F4;
  --paper-lo:#EFDDD6;
  --wine:#4A1622;
  --wine-deep:#33101A;
  --wine-soft:#7F4E58;
  --wine-line:rgba(74,22,34,.2);
  --pop:#C47A8C;
  --pink:#EBC3CD;
  --display:"Lilita One","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;
  --script:"Playfair Display",Georgia,serif;
  --body:"Jost","Futura","Avenir Next","Century Gothic",system-ui,sans-serif;
  --r:4px;
}
html{background:var(--paper)}
body{background:var(--paper);color:var(--wine);font:400 1rem/1.55 var(--body);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
#app{overflow-x:clip}
button,input,textarea,select{font:inherit;color:inherit}
h1,h2,h3,h4{text-wrap:balance}
h1,h2,h3,h4,legend{font-synthesis:none}
p{margin:0}
:focus-visible{outline:3px solid var(--wine-deep);outline-offset:2px}
.ph{color:var(--wine-soft);font-style:italic;font-weight:400}
.hint{font-size:.88rem;color:var(--wine-soft)}

/* bands */
.band{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.inner{max-width:1200px;margin-inline:auto}
.top-band{padding-block:2.25rem 1.75rem;background:var(--wine);color:var(--paper)}
.top-band .mast-title{color:var(--pink)}
.top-band .btn-ghost{color:var(--paper);border-color:var(--pink)}
.top-band .btn-ghost:hover{background:var(--wine-deep);border-color:var(--paper)}
.top-band :focus-visible{outline-color:var(--pink)}
.rail-band{padding-block:2.25rem 1.75rem}
.detail-band{padding-block:2.25rem 5rem;border-top:1.5px solid var(--wine-line)}
body.is-editing .detail-band{padding-bottom:9rem}

/* header */
.mast{display:flex;flex-wrap:wrap;gap:1rem 2rem;align-items:flex-end;justify-content:space-between}
.mast-text{flex:1 1 20rem;min-width:0}
.eyebrow{font:500 .78rem/1.35 var(--body);letter-spacing:.16em;text-transform:uppercase;margin:0 0 .6rem}
.mast-title{font-family:var(--display);font-weight:400;font-size:clamp(2.4rem,6.5vw,4.6rem);line-height:.98;letter-spacing:.01em;text-transform:uppercase;margin:0}
.mast-title em{font-family:var(--script);font-style:italic;font-weight:400;text-transform:none;letter-spacing:0;color:var(--paper)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;font:600 .82rem/1 var(--body);letter-spacing:.1em;text-transform:uppercase;padding:.85rem 1.2rem;border-radius:var(--r);border:1.5px solid var(--wine);background:var(--wine);color:var(--paper);cursor:pointer;transition:background .15s}
.btn:hover{background:var(--wine-deep);border-color:var(--wine-deep)}
.btn-ghost{background:transparent;color:var(--wine)}
.btn-ghost:hover{background:var(--paper-hi);border-color:var(--wine)}
.btn-sm{padding:.6rem .9rem;font-size:.74rem}
.btn:disabled{opacity:.55;cursor:default}
.link-btn{background:none;border:0;padding:.25rem;color:var(--wine);font:500 .85rem var(--body);text-decoration:underline;text-underline-offset:3px;cursor:pointer}

/* sessions: contents list, then a wrapping grid of boxes */
.rail-head{text-align:center;margin-bottom:1.75rem}
.rail-title{font:400 clamp(2.1rem,5.5vw,3.6rem)/1 var(--display);letter-spacing:.02em;text-transform:uppercase;margin:0}
.toc-wrap{max-width:40rem;margin:0 auto 2.75rem}
.toc-toggle{display:flex;align-items:center;gap:.6rem;margin:0 auto;padding:.6rem 1.1rem;border:1.5px solid var(--wine);border-radius:999px;background:transparent;color:var(--wine);font:500 .74rem/1.2 var(--body);letter-spacing:.18em;text-transform:uppercase;cursor:pointer;transition:background .15s,color .15s}
.toc-toggle:hover{background:var(--paper-hi)}
.toc-toggle[aria-expanded="true"]{background:var(--wine);color:var(--paper)}
.toc-caret{font-size:1rem;line-height:1;letter-spacing:0}
.toc-empty{text-align:center;margin-top:1rem}
.toc{list-style:none;margin:1rem 0 0;padding:0;border-top:1px solid var(--wine-line)}
.toc li{border-bottom:1px solid var(--wine-line)}
.toc-link{display:flex;align-items:baseline;gap:.75rem;width:100%;padding:.75rem .5rem;background:none;border:0;color:var(--wine);text-align:left;cursor:pointer;transition:background .15s}
.toc-link:hover,.toc-link[aria-current="true"]{background:var(--paper-hi)}
.toc-num{flex:0 0 1.4rem;font-weight:500;font-variant-numeric:tabular-nums}
.toc-name{font-weight:600;min-width:0;overflow-wrap:anywhere}
.toc-lead{flex:1 1 1.5rem;min-width:1.5rem;border-bottom:1.5px dotted var(--wine-line);transform:translateY(-.3em)}
.toc-co{font-family:var(--script);font-style:italic;font-size:1.05rem;text-align:right;min-width:0;overflow-wrap:anywhere}
.track{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1.5rem 1rem}
@media (min-width:700px){.track{grid-template-columns:repeat(3,minmax(0,1fr));gap:1.75rem 1.25rem}}
@media (min-width:1000px){.track{grid-template-columns:repeat(4,minmax(0,1fr))}}
.sess-item{position:relative;min-width:0;display:flex;flex-direction:column;gap:.7rem}
.sess-card{flex:1 1 auto;display:grid;gap:.85rem;align-content:start;width:100%;padding:0;border:0;background:none;color:var(--wine);text-align:left;cursor:pointer;border-radius:clamp(1.25rem,3vw,2rem)}
.sess-panel{position:relative;display:grid;place-items:center;aspect-ratio:4/5;padding:2.75rem .9rem 3.75rem;border-radius:clamp(1.25rem,3vw,2rem);background:var(--card,var(--paper-hi));color:var(--card-ink,var(--wine));border:1.5px solid var(--card-line,var(--wine-line));transition:transform .2s ease,box-shadow .2s}
.sess-card:hover .sess-panel{transform:translateY(-4px)}
.sess-panel .ph{color:inherit;opacity:.7}
.sess-badge{position:absolute;top:.85rem;left:.85rem;padding:.3rem .65rem;border-radius:999px;background:var(--card-ink,var(--wine));color:var(--card,var(--paper-hi));font:500 .74rem/1.2 var(--body);letter-spacing:.14em;text-transform:uppercase}
.sess-brand{font-family:var(--display);font-weight:400;font-size:clamp(1.5rem,3vw,2.6rem);line-height:1.05;text-transform:uppercase;letter-spacing:.01em;text-align:center;overflow-wrap:anywhere;text-wrap:balance}
.sess-mid{display:grid;justify-items:center;gap:.85rem;width:100%}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.sess-logo{display:block;width:86%;height:clamp(3rem,7vw,5.25rem);background:currentColor;-webkit-mask:var(--logo) center/contain no-repeat;mask:var(--logo) center/contain no-repeat}
.logo-row{position:relative;display:flex;flex-wrap:wrap;align-items:center;gap:.75rem}
.logo-prev{display:grid;place-items:center;width:9rem;height:4.5rem;padding:.6rem;border-radius:.9rem;background:var(--card,var(--paper-hi));color:var(--card-ink,var(--wine));border:1.5px solid var(--card-line,var(--wine-line))}
.logo-prev .sess-logo{width:100%;height:100%}
.sr-file{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none}
.sr-file:focus-visible+label{outline:3px solid var(--wine-deep);outline-offset:2px}
.sess-pill{position:absolute;left:50%;bottom:.95rem;transform:translateX(-50%);padding:.6rem 1.05rem;border-radius:999px;border:1.5px solid var(--card-ink,var(--wine));background:var(--card-ink,var(--wine));color:var(--card,var(--paper-hi));font:600 .74rem/1 var(--body);letter-spacing:.1em;text-transform:uppercase;white-space:nowrap;transition:background .15s,color .15s}
.sess-card:hover .sess-pill{background:transparent;color:var(--card-ink,var(--wine))}
.is-open .sess-panel{box-shadow:0 0 0 3px var(--paper),0 0 0 5.5px var(--pop)}
.sess-meta{display:grid;gap:.15rem;padding-inline:.35rem}
.sess-name{font-weight:600;font-size:1.2rem;line-height:1.25}
.sess-role{font-size:.95rem;line-height:1.4;color:var(--wine-soft);overflow-wrap:anywhere}
.sess-add .sess-panel{--card:transparent;--card-ink:var(--wine);--card-line:var(--wine);border-style:dashed;gap:.4rem;align-content:center}
.sess-add-plus{font:300 3rem/1 var(--body)}
.sess-add-lbl{font:600 .74rem/1 var(--body);letter-spacing:.14em;text-transform:uppercase}
.color-row{display:flex;align-items:center;gap:.75rem;flex-wrap:wrap}
.color-inp{width:3.25rem;height:2.6rem;padding:.15rem;border:1.5px solid var(--wine-line);border-radius:var(--r);background:var(--paper);cursor:pointer}
.link-btn:disabled{opacity:.45;cursor:default;text-decoration:none}

/* edit tools under each box */
.sess-tools{display:flex;justify-content:center;gap:.35rem}
.tool{display:grid;place-items:center;min-width:2.2rem;height:2.2rem;padding:0 .5rem;border:1.5px solid var(--wine);border-radius:var(--r);background:transparent;color:var(--wine);cursor:pointer;font-size:.95rem;line-height:1}
.tool:hover:not(:disabled){background:var(--paper-lo)}
.tool:disabled{opacity:.3;cursor:default}
.tool.is-armed{background:var(--wine-deep);color:var(--paper);font-size:.68rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase}
.tool-grip{cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;color:var(--wine-soft)}
.tool-grip::before{content:"";width:14px;height:8px;background-image:radial-gradient(circle,currentColor 1.2px,transparent 1.4px);background-size:4.67px 4px}
.sess-item.is-dragging{opacity:.45}
.sess-item.drop-before::before,.sess-item.drop-after::after{content:"";position:absolute;top:0;bottom:0;width:3px;border-radius:2px;background:var(--wine);left:-.7rem}
.sess-item.drop-after::after{left:auto;right:-.7rem}

/* open session */
.detail-empty{text-align:center;color:var(--wine-soft);padding-block:1rem}
.detail-head{display:flex;justify-content:flex-end;margin-bottom:.5rem;max-width:62rem}
.plate{display:flex;gap:1.1rem;align-items:stretch;margin-bottom:2.25rem;max-width:62rem}
.plate-num{display:flex;align-items:center;padding-right:1.1rem;border-right:1.5px solid var(--wine-line);font-family:var(--body);font-weight:400;font-size:clamp(2rem,5vw,2.75rem);line-height:1;font-variant-numeric:tabular-nums}
.plate-text{min-width:0;flex:1 1 auto}
.plate-name{font-family:var(--display);font-weight:400;font-size:clamp(2.2rem,5.5vw,3.6rem);line-height:1;letter-spacing:.01em;text-transform:uppercase;margin:0}
.plate-role{margin-top:.55rem;font-size:1.08rem}
.sep{margin-inline:.45rem;opacity:.6}
.plate-links{margin-top:.9rem}
.li-link{display:inline-flex;align-items:center;gap:.35rem;padding:.4rem .8rem;border:1.5px solid var(--wine);border-radius:999px;color:var(--wine);text-decoration:none;font-size:.8rem;font-weight:500;letter-spacing:.08em;text-transform:uppercase;transition:background .15s}
.li-link:hover{background:var(--wine);color:var(--paper)}
.notes{border-top:1.5px solid var(--wine);padding-top:1.1rem;max-width:46rem}
.notes-title{font-family:var(--display);font-weight:400;font-size:1.6rem;letter-spacing:.02em;text-transform:uppercase;margin:0 0 1rem}
.notes-list{margin:0;padding-left:1.2rem;display:grid;gap:.85rem;font-size:1.08rem}
.notes-list li{white-space:pre-line;overflow-wrap:anywhere;padding-left:.2rem}
.notes-list li::marker{content:"\25C6\00a0\00a0";font-size:.7em}
.empty{border:1.5px dashed var(--wine-line);border-radius:var(--r);padding:1.25rem;display:grid;gap:.75rem;justify-items:start;color:var(--wine-soft)}
.notice{display:flex;flex-wrap:wrap;gap:.75rem 1rem;align-items:center;justify-content:space-between;border:1.5px dashed var(--wine);border-radius:var(--r);padding:.8rem 1rem;margin-bottom:1.5rem;background:var(--paper-hi)}
.notice p{flex:1 1 18rem;min-width:0}
.notice-btns{display:flex;flex-wrap:wrap;gap:.5rem}

/* editor */
.ed{display:grid;gap:1.25rem;max-width:54rem}
.ed-title{font-family:var(--display);font-weight:400;text-transform:uppercase;font-size:clamp(2rem,5vw,3rem);line-height:1;margin:0}
.ed-card{border:1.5px solid var(--wine);border-radius:var(--r);padding:1rem 1.25rem 1.25rem;margin:0;background:var(--paper-hi);min-width:0;display:grid;gap:.9rem}
.ed-card legend{font-family:var(--display);font-weight:400;font-size:1.3rem;letter-spacing:.02em;text-transform:uppercase;padding:0 .4rem}
.fld{display:grid;gap:.3rem;min-width:0;align-content:start}
.fld>label{font-size:.74rem;letter-spacing:.12em;text-transform:uppercase;font-weight:500}
.inp{width:100%;background:var(--paper);color:var(--wine);border:1.5px solid var(--wine-line);border-radius:var(--r);padding:.6rem .75rem;line-height:1.4}
.inp:focus{border-color:var(--wine)}
.inp::placeholder{color:var(--wine-soft);opacity:.75}
textarea.inp{resize:vertical}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.9rem}
@media (max-width:620px){.grid2{grid-template-columns:minmax(0,1fr)}}
.ed-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:.5rem;align-items:end}
.ed-add{justify-self:start}

/* edit bar */
.editbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--wine);color:var(--paper);padding-top:.85rem;padding-bottom:calc(.85rem + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));box-shadow:0 -4px 0 var(--wine-deep)}
.editbar-in{max-width:1200px;margin-inline:auto;display:flex;flex-wrap:wrap;gap:.75rem 1.5rem;align-items:center;justify-content:space-between}
.editbar-msg{flex:1 1 20rem;min-width:0;font-size:.92rem}
.editbar-msg.is-err{font-weight:600}
.editbar-btns{display:flex;flex-wrap:wrap;gap:.5rem}
.editbar .btn{background:var(--paper);color:var(--wine);border-color:var(--paper)}
.editbar .btn:hover{background:var(--paper-hi)}
.editbar .btn-ghost{background:transparent;color:var(--paper)}
.editbar .btn-ghost:hover{background:var(--wine-deep)}
.editbar :focus-visible{outline-color:var(--paper)}
.copy-box{flex:1 1 100%;min-height:5rem;background:var(--wine-deep);color:var(--paper);border:1px solid var(--paper);border-radius:var(--r);padding:.5rem;font-size:.8rem}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
</style>

const $ = (s, r) => (r || document).querySelector(s);
const ESC = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ESC[c]);
const str = v => typeof v === 'string' ? v : (v == null ? '' : String(v));
const clone = o => JSON.parse(JSON.stringify(o));
const filled = s => !!(s && s.trim());
const ph = (text, fallback) => filled(text) ? esc(text) : '<span class="ph">' + esc(fallback) + '</span>';
const reduced = () => { try { return window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { return false; } };
function hash(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return (h >>> 0).toString(36); }
function mkStore(get) { return { get(k) { try { return get().getItem(k); } catch (e) { return null; } }, set(k, v) { try { get().setItem(k, v); } catch (e) {} }, del(k) { try { get().removeItem(k); } catch (e) {} } }; }
const store = mkStore(() => window.localStorage);
const sess = mkStore(() => window.sessionStorage);
function fid(path) { return 'f-' + String(path).replace(/[^a-z0-9]+/gi, '-'); }
function setPath(obj, path, v) { const ks = path.split('.'); let o = obj; for (let i = 0; i < ks.length - 1; i++) { o = o[ks[i]]; if (o == null) return; } o[ks[ks.length - 1]] = v; }
function fkSel(fk) { return '[data-fk="' + String(fk).replace(/["\\]/g, '\\$&') + '"]'; }

/* ---------- data ---------- */
function slugify(s) { return str(s).toLowerCase().normalize('NFKD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 40); }
function normSpeaker(s, used) {
  s = s || {};
  let id = slugify(s.id) || slugify(s.name) || 'session';
  if (RESERVED.includes(id) || id.indexOf('comment-') === 0) id = 's-' + id;
  const base = id; let n = 2;
  while (used.has(id)) id = base + '-' + (n++);
  used.add(id);
  const color = /^#[0-9a-f]{6}$/i.test(str(s.color)) ? str(s.color).toLowerCase() : '';
  const logo = /^data:image\/png;base64,[A-Za-z0-9+/=]+$/.test(str(s.logo)) && str(s.logo).length < 400000 ? str(s.logo) : '';
  return { id, name: str(s.name), role: str(s.role), company: str(s.company), linkedin: str(s.linkedin), color, logo, notes: Array.isArray(s.notes) ? s.notes.map(str) : [] };
}
function linkUrl(v) {
  v = str(v).trim();
  if (!v) return '';
  if (!/^https?:\/\//i.test(v)) v = 'https://' + v.replace(/^\/+/, '');
  try { const u = new URL(v); return (u.protocol === 'https:' || u.protocol === 'http:') && u.hostname.indexOf('.') > 0 ? u.href : ''; }
  catch (e) { return ''; }
}
function normState(d) {
  d = d || {};
  const site = d.site || {};
  const used = new Set();
  return {
    v: 2,
    site: { eyebrow: str(site.eyebrow), title: str(site.title) || 'Guest Speaker Recap' },
    speakers: Array.isArray(d.speakers) ? d.speakers.map(s => normSpeaker(s, used)) : []
  };
}
function readData() {
  try { return normState(JSON.parse(document.getElementById('site-data').textContent)); }
  catch (e) { return normState({}); }
}
function roleLine(sp) {
  const parts = [sp.role, sp.company].filter(filled).map(esc);
  return parts.length ? parts.join('<span class="sep" aria-hidden="true">·</span>') : '<span class="ph">Role and company</span>';
}

/* ---------- state ---------- */
const data = readData();
const dataHash = hash(JSON.stringify(data));
const ui = { tab: 'home', tocOpen: false, editing: false, draft: null, saving: false, status: '', statusKind: '', showCopy: false, copyText: '', confirm: null, canEdit: false, readOnly: false, artifact: null, resumeDraft: null, resumeStale: false };
const current = () => (ui.editing ? ui.draft : data);
const curIndex = () => current().speakers.findIndex(s => s.id === ui.tab);
const curSpeaker = () => current().speakers[curIndex()] || null;

/* ---------- shell ---------- */
let els = null;
function buildShell() {
  document.getElementById('app').innerHTML =
    '<header class="band top-band"><div class="inner mast" id="mast"></div></header>' +
    '<section class="band rail-band" aria-labelledby="rail-title"><div class="inner">' +

function focusFk(fk) {
  if (!fk) return;
  const el = document.querySelector(fkSel(fk));
  if (el && typeof el.focus === 'function') el.focus({ preventScroll: true });
}
function render() {
  const a = document.activeElement;

  renderMast(); renderRail(); renderView(); renderEditBar();
  if (fk) { const el = document.querySelector(fkSel(fk)); if (el && el !== document.activeElement) el.focus({ preventScroll: true }); }
}

function titleHtml(t) {
  const words = str(t).trim().split(/\s+/).filter(Boolean);
  if (words.length < 2) return esc(t);
  const last = words.pop();
  return esc(words.join(' ')) + ' <em>' + esc(last) + '</em>';
}
function renderMast() {
  const s = current().site;
  let h = '<div class="mast-text">' + (filled(s.eyebrow) ? '<p class="eyebrow">' + esc(s.eyebrow) + '</p>' : '') +
    '<h1 class="mast-title">' + titleHtml(s.title) + '</h1></div>';
  if (ui.canEdit && !ui.editing) h += '<button class="btn btn-ghost" data-action="edit-start" data-fk="mast-edit">Edit page</button>';
  els.mast.innerHTML = h;
}

/* ---------- sessions: contents + boxes ---------- */
function inkFor(hex) {
  const n = parseInt(hex.slice(1), 16);
  const lin = c => { c /= 255; return c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4); };
  const L = 0.2126 * lin((n >> 16) & 255) + 0.7152 * lin((n >> 8) & 255) + 0.0722 * lin(n & 255);
  return L > 0.3 ? '#4A1622' : '#F7EEE9';
}
function cardStyle(sp) { return sp.color ? ' style="--card:' + sp.color + ';--card-ink:' + inkFor(sp.color) + ';--card-line:' + sp.color + '"' : ''; }
function logoSpan(sp) { return sp.logo ? '<span class="sess-logo" style="--logo:url(' + sp.logo + ')" aria-hidden="true"></span>' : ''; }
function renderRail() {
  const st = current(); const n = st.speakers.length;
  let t = '<button class="toc-toggle" data-action="toc-toggle" data-fk="toc-toggle" aria-expanded="' + ui.tocOpen + '" aria-controls="toc-list">Table of contents<span class="toc-caret" aria-hidden="true">' + (ui.tocOpen ? '−' : '+') + '</span></button>';
  if (n) {
    t += '<ol class="toc" id="toc-list"' + (ui.tocOpen ? '' : ' hidden') + '>' + st.speakers.map((sp, i) => '<li><button class="toc-link" data-action="open" data-id="' + esc(sp.id) + '" data-fk="toc-' + esc(sp.id) + '"' + (ui.tab === sp.id ? ' aria-current="true"' : '') + '>' +
      '<span class="toc-num">' + (i + 1) + '</span><span class="toc-name">' + ph(sp.name, 'New speaker') + '</span><span class="toc-lead" aria-hidden="true"></span><span class="toc-co">' + ph(sp.company, 'Company') + '</span></button></li>').join('') + '</ol>';
  } else if (ui.tocOpen) t += '<p class="hint toc-empty" id="toc-list">No sessions yet.</p>';
  els.toc.innerHTML = t;
  let h = '';
  st.speakers.forEach((sp, i) => {
    const id = esc(sp.id); const open = ui.tab === sp.id;
    const nm = esc(filled(sp.name) ? sp.name : 'this speaker');
    h += '<div class="sess-item' + (open ? ' is-open' : '') + '" data-id="' + id + '">' +
      '<button class="sess-card" data-action="open" data-id="' + id + '" data-fk="card-' + id + '"' + (open ? ' aria-current="true"' : '') + '>' +
        '<span class="sess-panel"' + cardStyle(sp) + '><span class="sess-badge">Session ' + (i + 1) + '</span><span class="sess-mid">' + (sp.logo ? logoSpan(sp) + '<span class="sr">' + esc(sp.company) + '</span>' : '<span class="sess-brand">' + ph(sp.company, 'Company') + '</span>') + '</span>' +
        '<span class="sess-pill">' + (open ? 'Open below' : 'View notes') + '</span></span>' +
        '<span class="sess-meta"><span class="sess-name">' + ph(sp.name, 'New speaker') + '</span>' + (filled(sp.role) ? '<span class="sess-role">' + esc(sp.role) + '</span>' : '') + '</span>' +
      '</button>';
    if (ui.editing) {
      const armed = ui.confirm === 'del-' + sp.id;
      h += '<div class="sess-tools"><span class="tool tool-grip" title="Drag to reorder" aria-hidden="true"></span>' +
        '<button class="tool" data-action="move-speaker" data-id="' + id + '" data-d="-1" data-fk="left-' + id + '" aria-label="Move ' + nm + ' earlier"' + (i === 0 ? ' disabled' : '') + '>←</button>' +
        '<button class="tool" data-action="move-speaker" data-id="' + id + '" data-d="1" data-fk="right-' + id + '" aria-label="Move ' + nm + ' later"' + (i === n - 1 ? ' disabled' : '') + '>→</button>' +
        '<button class="tool' + (armed ? ' is-armed' : '') + '" data-action="del-speaker" data-id="' + id + '" data-fk="x-' + id + '" aria-label="' + (armed ? 'Press again to remove ' : 'Remove ') + nm + '">' + (armed ? 'Remove?' : '×') + '</button></div>';
    }
    h += '</div>';
  });
  if (ui.canEdit) {

  }

/* ---------- open session ---------- */
function renderView() {
  const st = current();
  if (ui.tab !== 'home' && !st.speakers.some(s => s.id === ui.tab)) ui.tab = 'home';
  let h = resumeBanner();
  if (ui.tab === 'home') {
    h += '<p class="detail-empty">' + (st.speakers.length ? (ui.editing ? 'Choose a session above to edit it, or add a new speaker.' : 'Choose a session above to read the notes.') : (ui.canEdit ? 'Add your first speaker using the box above.' : 'No sessions yet.')) + '</p>';
  } else {
    const idx = curIndex(); const sp = st.speakers[idx];
    h += ui.editing ? speakerEditor(sp, idx) : speakerView(sp, idx);
  }
  els.view.innerHTML = h;
}
function resumeBanner() {
  if (!ui.canEdit || !ui.resumeDraft || ui.editing) return '';
  return '<div class="notice"><p><b>You have unsaved edits from earlier.</b> ' +
    (ui.resumeStale ? 'They were made on an older version of the page, so saving them replaces the newer one.' : 'Pick up where you left off, or throw them away.') +
    '</p><span class="notice-btns"><button class="btn btn-sm" data-action="edit-resume" data-fk="resume">Resume editing</button><button class="btn btn-ghost btn-sm" data-action="edit-drop-draft" data-fk="drop-draft">Discard</button></span></div>';
}

    '<p class="eyebrow">Session ' + (idx + 1) + '</p>' +

    '<p class="plate-role">' + roleLine(sp) + '</p>' +
    (url ? '<p class="plate-links"><a class="li-link" href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">LinkedIn profile<span aria-hidden="true">↗</span></a></p>' : '') +
    '</div></header>';
}

  else h += '<div class="empty"><p>Notes from this session haven\'t been added yet.</p>' + (ui.canEdit ? '<button class="btn btn-ghost btn-sm" data-action="edit-start" data-fk="notes-edit">Add notes</button>' : '') + '</div>';

/* ---------- editor ---------- */
function inp(label, path, value, o) {
  o = o || {}; const id = fid(path);
  return '<div class="fld"><label for="' + id + '">' + esc(label) + '</label><input class="inp" id="' + id + '" data-bind="' + path + '" data-fk="' + id + '" value="' + esc(value) + '"' +
    (o.ph ? ' placeholder="' + esc(o.ph) + '"' : '') + (o.live ? ' data-live="' + o.live + '"' : '') + (o.mode ? ' inputmode="' + o.mode + '"' : '') + ' autocomplete="off"></div>';
}
function area(label, path, value) {
  const id = fid(path);
  return '<div class="fld"><label for="' + id + '">' + esc(label) + '</label><textarea class="inp" id="' + id + '" rows="2" data-bind="' + path + '" data-fk="' + id + '">' + esc(value) + '</textarea></div>';
}
function logoField(sp, P) {
  const lid = fid(P + '.logo');
  return '<div class="fld"><label for="' + lid + '">Logo</label><span class="logo-row">' +
    (sp.logo ? '<span class="logo-prev"' + cardStyle(sp) + '>' + logoSpan(sp) + '</span>' : '') +
    '<input type="file" accept="image/png,image/jpeg,image/webp" id="' + lid + '" class="sr-file" data-logo="' + P + '.logo" data-fk="' + lid + '">' +
    '<label class="btn btn-ghost btn-sm" for="' + lid + '">' + (sp.logo ? 'Replace logo' : 'Upload logo') + '</label>' +
    (sp.logo ? '<button class="link-btn" data-action="logo-clear" data-fk="logo-clear">Remove</button>' : '') +
    '</span><span class="hint">Shows under the company name on the box. A dark logo on a white or clear background works best.</span></div>';
}
function processLogo(file) {
  return new Promise((resolve, reject) => {
    if (!file || !/^image\//.test(file.type)) { reject(new Error('type')); return; }
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      try {
        const W = img.naturalWidth, H = img.naturalHeight;
        const c = document.createElement('canvas'); c.width = W; c.height = H;
        const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, W, H); x.drawImage(img, 0, 0);
        const d = x.getImageData(0, 0, W, H); const px = d.data;
        let minX = W, minY = H, maxX = -1, maxY = -1;
        for (let i = 0, j = 0; i < px.length; i += 4, j++) {
          const a = 255 - Math.min(px[i], px[i + 1], px[i + 2]); const v = a < 14 ? 0 : a;
          px[i] = px[i + 1] = px[i + 2] = 0; px[i + 3] = v;
          if (v) { const cx = j % W, cy = (j / W) | 0; if (cx < minX) minX = cx; if (cx > maxX) maxX = cx; if (cy < minY) minY = cy; if (cy > maxY) maxY = cy; }
        }
        if (maxX < 0) { reject(new Error('empty')); return; }
        x.putImageData(d, 0, 0);
        const cw = maxX - minX + 1, ch = maxY - minY + 1; const k = Math.min(1, 520 / cw, 260 / ch);
        const o = document.createElement('canvas'); o.width = Math.max(1, Math.round(cw * k)); o.height = Math.max(1, Math.round(ch * k));
        const ox = o.getContext('2d'); ox.imageSmoothingQuality = 'high'; ox.drawImage(c, minX, minY, cw, ch, 0, 0, o.width, o.height);
        resolve(o.toDataURL('image/png'));
      } catch (e) { reject(e); } finally { URL.revokeObjectURL(url); }
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('load')); };
    img.src = url;
  });
}
function speakerEditor(sp, idx) {
  const P = 'speakers.' + idx;
  let h = '<div class="ed"><h2 class="ed-title" id="ed-title">' + ph(sp.name, 'New speaker') + '</h2>';
  h += '<fieldset class="ed-card"><legend>Speaker</legend><div class="grid2">' +
    inp('Name', P + '.name', sp.name, { live: 'rail', ph: 'Speaker name' }) +
    inp('Role', P + '.role', sp.role, { live: 'rail', ph: 'Job title' }) +
    inp('Company', P + '.company', sp.company, { live: 'rail', ph: 'Company or brand' }) +
    inp('LinkedIn profile', P + '.linkedin', sp.linkedin, { ph: 'linkedin.com/in/…', mode: 'url' }) +
    '<div class="fld"><label for="' + fid(P + '.color') + '">Box colour</label><span class="color-row"><input class="color-inp" type="color" id="' + fid(P + '.color') + '" data-bind="' + P + '.color" data-live="rail" data-fk="' + fid(P + '.color') + '" value="' + esc(sp.color || '#f7f1e6') + '">' +
    '<button class="link-btn" data-action="color-clear" data-fk="color-clear"' + (sp.color ? '' : ' disabled') + '>Use a plain box</button></span></div>' +
    logoField(sp, P) +
    '</div></fieldset>';
  h += '<fieldset class="ed-card"><legend>Session notes</legend><p class="hint">The points you want to remember from this session.</p>';
  sp.notes.forEach((n, i) => {
    h += '<div class="ed-row">' + area('Note ' + (i + 1), P + '.notes.' + i, n) +
      '<button class="link-btn" data-action="note-del" data-i="' + i + '" data-fk="del-note-' + i + '" aria-label="Remove note ' + (i + 1) + '">Remove</button></div>';
  });
  h += sp.notes.length < MAX_NOTES
    ? '<button class="btn btn-ghost btn-sm ed-add" data-action="note-add" data-fk="add-note">Add a note</button>'
    : '<p class="hint">That\'s the most notes one session can hold.</p>';
  return h + '</fieldset></div>';
}

/* ---------- edit bar ---------- */
function renderEditBar() {
  const bar = els.bar;
  document.body.classList.toggle('is-editing', ui.editing);
  bar.hidden = !ui.editing;
  if (!ui.editing) { bar.innerHTML = ''; return; }
  const msg = ui.status || 'Editing. Nobody else sees your changes until you save.';
  let h = '<div class="editbar-in"><p class="editbar-msg' + (ui.statusKind === 'err' ? ' is-err' : '') + '" role="status">' + esc(msg) + '</p><div class="editbar-btns">' +
    '<button class="btn btn-ghost btn-sm" data-action="edit-discard" data-fk="edit-discard"' + (ui.saving ? ' disabled' : '') + '>' + (ui.confirm === 'discard' ? 'Press again to discard' : 'Discard changes') + '</button>' +
    (ui.showCopy ? '<button class="btn btn-ghost btn-sm" data-action="edit-copy" data-fk="edit-copy">Copy content</button>' : '') +
    '<button class="btn btn-sm" data-action="edit-save" data-fk="edit-save"' + (ui.saving || ui.readOnly ? ' disabled' : '') + '>' + (ui.saving ? 'Saving…' : 'Save') + '</button></div>';
  if (ui.copyText) h += '<textarea class="copy-box" id="copy-box" aria-label="Page content" readonly>' + esc(ui.copyText) + '</textarea>';
  bar.innerHTML = h + '</div>';
}
function setStatus(msg, kind, showCopy) { ui.status = msg; ui.statusKind = kind || ''; if (showCopy) ui.showCopy = true; renderEditBar(); }

/* ---------- drafts (this browser only) ---------- */
let draftTimer = null;
function writeDraft(now, base) {
  clearTimeout(draftTimer);
  const go = () => { if (ui.draft) store.set(DRAFT_KEY, JSON.stringify({ base: base || dataHash, draft: ui.draft, tab: ui.tab })); };
  if (now) go(); else draftTimer = setTimeout(go, 400);
}
function readDraft() {
  const raw = store.get(DRAFT_KEY);
  if (!raw) return;
  try {
    const d = JSON.parse(raw);
    if (d && d.draft && (d.base === dataHash || d.base === 'stale')) {
      const nd = normState(d.draft);
      if (JSON.stringify(nd) !== JSON.stringify(data)) { ui.resumeDraft = nd; ui.resumeStale = d.base === 'stale'; return; }
    }
  } catch (e) {}
  store.del(DRAFT_KEY);
}
function startEdit(draft, quiet) {
  Object.assign(ui, { editing: true, draft, status: '', statusKind: '', confirm: null, copyText: '', showCopy: false });
  render();
  if (!quiet) { const first = els.view.querySelector('input,textarea'); if (first) first.focus(); }
}

/* ---------- saving ---------- */
function buildDocument(state) {
  const css = document.getElementById('site-css').textContent;
  const js = document.getElementById('site-js').textContent;
  const json = JSON.stringify(state, null, 2).replace(/</g, '\\u003c');
  const end = '</scr' + 'ipt>';
  return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>' + RESET + '</style></head><body>\n' +
    '<title>' + esc(state.site.title || 'Guest Speaker Recap') + '</title>\n' +
    '<meta name="claude:viewport-fit-sides" content="cover">\n' +
    FONTS + '\n' +
    '<style id="site-css">' + css + '</style>\n' +
    '<div id="app"></div>\n' +
    '<script type="application/json" id="site-data">\n' + json + '\n' + end + '\n' +
    '<script id="site-js">' + js + end + '\n' +
    '\n</body></html>';
}
async function save(retried) {
  if (!ui.editing || (ui.saving && !retried)) return;
  if (!ui.artifact) { setStatus('Saving isn\'t available in this view. Open the page on claude.ai while signed in, or copy your content and send it to Claude.', 'err', true); return; }
  const state = normState(ui.draft);
  let html;
  try { html = buildDocument(state); } catch (e) { setStatus('The page couldn\'t be prepared for saving. Copy your content and send it to Claude.', 'err', true); return; }
  ui.saving = true; ui.confirm = null; setStatus('Saving…');
  sess.set('gsr:tab', ui.tab);
  writeDraft(true);
  try {
    await ui.artifact.publish(html);
    store.del(DRAFT_KEY);
    ui.saving = false;
    setStatus('Saved. Loading the new version…');
  } catch (err) {
    const code = err && err.code;
    ui.saving = false;
    if (code === 'conflict') { writeDraft(true, 'stale'); setStatus('A newer version was saved somewhere else, so the page is reloading to it. Your edits are kept in this browser and you can resume them.', 'err'); return; }
    if (['not_writer', 'not_granted', 'consent_required', 'capability_disabled', 'capability_removed', 'not_declared'].includes(code)) { ui.readOnly = true; setStatus('This view is read-only, so changes can\'t be saved here. Only the page owner can save, from claude.ai.', 'err', true); return; }
    if (code === 'too_large') { setStatus('The page is too large to save. Shorten some notes and try again.', 'err'); return; }
    if (code === 'rate_limited') { setStatus('Saved too often in a short time. Wait a minute, then press Save again.', 'err'); return; }
    if (code === 'invalid_content' || code === 'transform_error') { setStatus('The content was rejected when saving. Copy your content and send it to Claude.', 'err', true); return; }
    if (!retried) { ui.saving = true; renderEditBar(); setTimeout(() => save(true), 1200 + Math.random() * 800); return; }
    setStatus('Saving failed because of a service problem. Try again in a moment.', 'err', true);
  }
}
function copyContent() {
  const text = JSON.stringify(normState(ui.draft || data), null, 2);
  const fallback = () => { ui.copyText = text; setStatus('Select the text below and copy it, then paste it into your chat with Claude.'); const ta = $('#copy-box'); if (ta) { ta.focus(); ta.select(); } };
  try { navigator.clipboard.writeText(text).then(() => setStatus('Content copied. Paste it into your chat with Claude.'), fallback); }
  catch (e) { fallback(); }
}

/* ---------- navigation ---------- */
function go(id, scrollToDetail) {
  ui.tab = id;
  if (ui.confirm && ui.confirm !== 'discard') ui.confirm = null;
  try { history.replaceState(null, '', '#' + id); } catch (e) {}
  render();
  if (scrollToDetail && id !== 'home') {
    const top = els.detail.getBoundingClientRect().top;
    if (top > window.innerHeight * 0.6 || top < 0) els.detail.scrollIntoView({ behavior: reduced() ? 'auto' : 'smooth', block: 'start' });
  }
}

/* ---------- actions ---------- */
let armTimer = null;
function arm(key, rerender) {
  ui.confirm = key; rerender();
  clearTimeout(armTimer);
  armTimer = setTimeout(() => { if (ui.confirm === key) { ui.confirm = null; rerender(); } }, 4000);
}
const ACTIONS = {
  'open': el => { if (ui.tab === el.dataset.id && !ui.editing && el.classList.contains('sess-card')) { go('home'); return; } go(el.dataset.id, true); },
  'toc-toggle': () => { ui.tocOpen = !ui.tocOpen; renderRail(); focusFk('toc-toggle'); },
  'close': () => { const id = ui.tab; go('home'); focusFk('card-' + id); },
  'edit-start': () => { if (!ui.editing) startEdit(clone(data)); },
  'edit-resume': () => { const d = ui.resumeDraft; const stale = ui.resumeStale; ui.resumeDraft = null; startEdit(d); if (stale) setStatus('These edits were made on an older version. Saving replaces the newer one.', 'err'); },
  'edit-drop-draft': () => { store.del(DRAFT_KEY); ui.resumeDraft = null; render(); },
  'edit-discard': () => {
    if (ui.confirm !== 'discard') { arm('discard', renderEditBar); focusFk('edit-discard'); return; }
    clearTimeout(draftTimer); store.del(DRAFT_KEY);
    Object.assign(ui, { editing: false, draft: null, confirm: null, status: '', statusKind: '', showCopy: false, copyText: '' });
    render(); focusFk('mast-edit');
  },
  'edit-save': () => save(false),
  'edit-copy': () => copyContent(),
  'add-speaker': () => {
    if (!ui.editing) startEdit(clone(data), true);
    const id = 's' + Date.now().toString(36);
    ui.draft.speakers.push({ id, name: '', role: '', company: '', linkedin: '', color: PALETTE[ui.draft.speakers.length % PALETTE.length], logo: '', notes: [] });
    writeDraft(); go(id, true);
    focusFk(fid('speakers.' + (ui.draft.speakers.length - 1) + '.name'));
  },
  'move-speaker': el => {
    const list = ui.draft.speakers; const i = list.findIndex(s => s.id === el.dataset.id); const j = i + (+el.dataset.d);
    if (i < 0 || j < 0 || j >= list.length) return;
    const t = list[i]; list[i] = list[j]; list[j] = t;
    writeDraft(); render();
    const same = document.querySelector(fkSel(el.dataset.fk));
    if (same && !same.disabled) same.focus({ preventScroll: true }); else focusFk('card-' + el.dataset.id);
  },
  'del-speaker': el => {
    const id = el.dataset.id;
    if (ui.confirm !== 'del-' + id) { arm('del-' + id, renderRail); focusFk('x-' + id); return; }
    const i = ui.draft.speakers.findIndex(s => s.id === id);
    if (i < 0) return;
    ui.draft.speakers.splice(i, 1);
    ui.confirm = null; writeDraft();
    if (ui.tab === id) go('home'); else render();
    focusFk('add-speaker');
  },
  'color-clear': () => {
    const sp = curSpeaker(); if (!sp) return;
    sp.color = ''; writeDraft(); renderRail(); renderView(); focusFk(fid('speakers.' + curIndex() + '.color'));
  },
  'logo-clear': () => {
    const sp = curSpeaker(); if (!sp) return;
    sp.logo = ''; writeDraft(); renderRail(); renderView(); focusFk(fid('speakers.' + curIndex() + '.logo'));
  },
  'note-add': () => {
    const sp = curSpeaker(); if (!sp || sp.notes.length >= MAX_NOTES) return;
    sp.notes.push(''); writeDraft(); renderView();
    focusFk(fid('speakers.' + curIndex() + '.notes.' + (sp.notes.length - 1)));
  },
  'note-del': el => {
    const sp = curSpeaker(); if (!sp) return;
    sp.notes.splice(+el.dataset.i, 1); writeDraft(); renderView(); focusFk('add-note');
  }
};

function onInput(e) {
  const el = e.target;
  if (!ui.editing || !el || !el.dataset || !el.dataset.bind) return;
  setPath(ui.draft, el.dataset.bind, el.value);
  writeDraft();
  if (el.dataset.live === 'rail') {
    renderRail();
    if (/\.color$/.test(el.dataset.bind)) { const b = document.querySelector(fkSel('color-clear')); if (b) b.disabled = false; }
    const t = $('#ed-title'); const sp = curSpeaker(); if (t && sp) t.innerHTML = ph(sp.name, 'New speaker');
  }
}

let wired = false;
function wire() {
  if (wired) return; wired = true;
  document.addEventListener('click', e => {
    const el = e.target.closest && e.target.closest('[data-action]');
    if (!el || el.disabled) return;
    const fn = ACTIONS[el.dataset.action];
    if (fn) { e.preventDefault(); fn(el, e); }
  });
  document.addEventListener('input', onInput);
  document.addEventListener('change', e => {
    const el = e.target;
    if (!ui.editing || !el || !el.dataset || !el.dataset.logo || !el.files || !el.files[0]) return;
    const path = el.dataset.logo; const fk = el.dataset.fk;
    setStatus('Preparing the logo…');
    processLogo(el.files[0]).then(url => {
      if (url.length > 400000) throw new Error('big');
      setPath(ui.draft, path, url); writeDraft(); renderRail(); renderView(); setStatus(''); focusFk(fk);
    }).catch(err => setStatus(err && err.message === 'empty' ? 'No logo found in that image. Try a dark logo on a light background.' : (err && err.message === 'big' ? 'That logo is too detailed to store. Try a smaller or simpler image.' : 'That image couldn\'t be used. Try a PNG or JPG file.'), 'err'));
  });
  document.addEventListener('pointerdown', dragStart);
  document.addEventListener('pointermove', dragMove);
  document.addEventListener('pointerup', dragEnd);
  document.addEventListener('pointercancel', dragEnd);
}

/* ---------- drag to reorder (edit mode) ---------- */
let drag = null;
function items() { return Array.prototype.slice.call(els.track.querySelectorAll('.sess-item[data-id]')); }
function dragStart(e) {
  const grip = e.target.closest && e.target.closest('.tool-grip');
  if (!grip || !ui.editing || (e.pointerType === 'mouse' && e.button !== 0)) return;
  e.preventDefault();
  const item = grip.closest('.sess-item');
  drag = { id: item.dataset.id, pointerId: e.pointerId, to: null };
  try { grip.setPointerCapture(e.pointerId); } catch (err) {}
  item.classList.add('is-dragging');
}
function dragMove(e) {
  if (!drag || e.pointerId !== drag.pointerId) return;
  e.preventDefault();
  const is = items(); let to = null, last = -1;
  for (let i = 0; i < is.length; i++) {
    const r = is[i].getBoundingClientRect();
    if (e.clientY < r.top || e.clientY > r.bottom) continue;
    last = i;
    if (e.clientX < r.left + r.width / 2) { to = i; break; }
    to = i + 1;
  }
  if (to === null) return;
  drag.to = to;
  const after = to > last;
  is.forEach((g, i) => { g.classList.toggle('drop-before', !after && i === to); g.classList.toggle('drop-after', after && i === last); });
}
function dragEnd(e) {
  if (!drag || e.pointerId !== drag.pointerId) return;
  const d = drag; drag = null;
  const list = ui.draft ? ui.draft.speakers : null;
  const from = list ? list.findIndex(s => s.id === d.id) : -1;
  if (list && from >= 0 && d.to != null && e.type === 'pointerup') {
    let to = d.to; if (to > from) to--;
    if (to !== from) { const moved = list.splice(from, 1)[0]; list.splice(to, 0, moved); writeDraft(); }
  }
  render();
}

/* ---------- capabilities ---------- */
async function initCaps() {
  const c = window.claude;
  if (!c || typeof c.use !== 'function') return;
  let art = null, usr = null;
  try { art = await c.use('artifact'); } catch (e) { art = null; }
  if (!art || typeof art.publish !== 'function') return;
  try { usr = await c.use('user'); } catch (e) { usr = null; }
  let can = false;
  if (usr) {
    try {
      const w = typeof usr.can === 'function' ? await usr.can('files.write') : null;
      can = w === null ? await usr.canEdit() : !!w;
    } catch (e) { can = false; }
  }
  ui.artifact = art; ui.canEdit = !!can;
  if (ui.canEdit) render();
}

/* ---------- boot ---------- */
function start(prev) {
  prev = prev || {};
  if (!els) buildShell();
  wire();
  const ids = ['home'].concat(data.speakers.map(s => s.id));
  let fromHash = '';
  try { fromHash = decodeURIComponent((location.hash || '').slice(1)); } catch (e) {}
  const fromSess = sess.get('gsr:tab'); sess.del('gsr:tab');
  ui.tab = [fromHash, prev.tab, fromSess].find(t => t && ids.includes(t)) || 'home';
  readDraft();
  render();
  initCaps();
}

const hot = window.claude && window.claude.hot;
try { if (hot && typeof hot.snapshot === 'function') hot.snapshot(() => ({ tab: ui.tab })); } catch (e) {}
if (hot && typeof hot.ready === 'function') hot.ready(start); else start((hot && hot.data) || {});
})();
</script>
